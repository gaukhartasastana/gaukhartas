# /etc/nginx/snippets/gaukhartas-security.conf
# nginx не наследует add_header внутрь location, если там есть свой —
# поэтому подключаем этот файл в каждом блоке, где заголовки добавляются.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
