# /etc/nginx/sites-available/gaukhartas — версия ДО выпуска сертификата.
# certbot сам перепишет её под HTTPS при первом запуске.
server {
    listen 80;
    listen [::]:80;
    server_name gaukhartas.com www.gaukhartas.com;
    root /var/www/gaukhartas;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 1m;
    include snippets/gaukhartas-security.conf;

    location /.well-known/acme-challenge/ { allow all; root /var/www/gaukhartas; }

    location ~* \.(webp|jpg|jpeg|png|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/gaukhartas-security.conf; access_log off;
    }
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=86400" always;
        include snippets/gaukhartas-security.conf;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include snippets/gaukhartas-security.conf;
    }

    location ~* /(data|node_modules)/  { return 404; }
    location ~* ^/test\d*\.js$         { return 404; }
    location ~* \.(env|pem)$           { return 404; }
    location = /BUGFIXES.md            { return 404; }

    location /admin/ {
        # allow 1.2.3.4;   ← свой IP, потом раскомментировать вместе с deny
        # deny all;
        try_files $uri $uri/ /admin/index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / { try_files $uri $uri/ =404; }
}
