# /etc/nginx/sites-available/gaukhartas
# Статику отдаёт nginx напрямую, Node дёргается только на /api/

server {
    listen 80;
    listen [::]:80;
    server_name gaukhartas.com www.gaukhartas.com;
    # certbot подставит сюда редирект на https сам
    root /var/www/gaukhartas;
    location /.well-known/acme-challenge/ { allow all; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gaukhartas.com www.gaukhartas.com;

    # сертификаты пропишет certbot
    root /var/www/gaukhartas;
    index index.html;

    # сжатие: HTML ужимается примерно втрое
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml text/xml;

    client_max_body_size 1m;

    include snippets/gaukhartas-security.conf;

    # картинки и шрифты — на год, они с хэшами не меняются
    location ~* \.(webp|jpg|jpeg|png|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/gaukhartas-security.conf;
        access_log off;
    }
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=86400" always;
        include snippets/gaukhartas-security.conf;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include snippets/gaukhartas-security.conf;
    }

    # служебное наружу не отдаём
    location ~* /(data|node_modules)/ { return 404; }
    location ~* ^/test\d*\.js$        { return 404; }
    location ~* \.(env|pem|json\.bak)$ { return 404; }
    location = /BUGFIXES.md            { return 404; }

    # админка: подключишь свой IP — станет доступна только с него
    location /admin/ {
        # allow 1.2.3.4;   ← сюда свой IP, потом раскомментировать
        # deny all;
        try_files $uri $uri/ /admin/index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / { try_files $uri $uri/ =404; }
}
